# Dev tooling only. The commands' own dependencies are listed in PLAN.md, "Dependencies".
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=videotools --cov-report=term-missing"

[tool.coverage.run]
branch = true
# Tier 2 runs the commands as subprocesses; coverage.py's .pth hook measures them when
# COVERAGE_PROCESS_START names this file (tests/tier2/conftest.py sets it) and parallel is on.
parallel = true
source = ["videotools"]

[tool.ruff]
target-version = "py39"
line-length = 100
