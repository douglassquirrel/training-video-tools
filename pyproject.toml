# Dev tooling only. The commands' own dependencies are listed in PLAN.md, "Dependencies".
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=videotools --cov-report=term-missing"
markers = ["slow: takes well over a second for a reason (a whole render); skip with -m \"not slow\""]

[tool.coverage.run]
branch = true
# Tier 2 runs the commands as subprocesses; coverage.py's .pth hook measures them when
# COVERAGE_PROCESS_START names this file (tests/tier2/conftest.py sets it) and parallel is on.
parallel = true
source = ["videotools"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The tests hold long expected lines of output, kept whole so they can be read.
"tests/*" = ["E501"]
# The example's scene modules are a video's own code: they import their shared helper by name.
"examples/*" = ["E402", "I001"]
